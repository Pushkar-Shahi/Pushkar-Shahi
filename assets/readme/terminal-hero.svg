      <rect x="24" y="36" width="10" height="10" rx="1.5" fill="#22c55e"/>
      <rect x="36" y="36" width="10" height="10" rx="1.5" fill="#22c55e"/>
      <rect x="0" y="48" width="10" height="10" rx="1.5" fill="#22c55e"/>
      <rect x="0" y="60" width="10" height="10" rx="1.5" fill="#22c55e"/>
      <rect x="0" y="72" width="10" height="10" rx="1.5" fill="#22c55e"/>

      <!-- S (Cyan) -->
