      <rect x="84" y="72" width="10" height="10" rx="1.5" fill="#0891b2"/>
      <rect x="96" y="72" width="10" height="10" rx="1.5" fill="#0891b2"/>
      <rect x="108" y="72" width="10" height="10" rx="1.5" fill="#0891b2"/>
      <rect x="120" y="72" width="10" height="10" rx="1.5" fill="#0891b2"/>
