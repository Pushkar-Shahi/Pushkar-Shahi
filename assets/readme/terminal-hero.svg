    <text x="450" y="22" text-anchor="middle" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="13" fill="#a1a1aa">pushkar@github:~</text>

    <!-- PS Pixel Monogram -->
    <g transform="translate(90,82)">
