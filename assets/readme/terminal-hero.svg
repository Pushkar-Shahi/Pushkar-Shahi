<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Neofetch-style profile card for Pushkar Shahi">
  <defs>
    <clipPath id="round"><rect x="0" y="0" width="900" height="300" rx="12"/></clipPath>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#round)">
    <!-- Background -->
    <rect width="900" height="300" fill="#0d1424"/>
    <!-- Terminal Header Bar -->
    <rect width="900" height="34" fill="#131c31"/>
    <circle cx="20" cy="17" r="6" fill="#f87171"/>
    <circle cx="42" cy="17" r="6" fill="#fbbf24"/>
    <circle cx="64" cy="17" r="6" fill="#34d399"/>
    <text x="450" y="22" text-anchor="middle" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="13" fill="#94a3b8" font-weight="600">pushkar@github:~/ai-mlops-core</text>

    <!-- PS Pixel Monogram -->
    <g transform="translate(90,82)">
      <!-- P (Electric Cyan) -->
      <rect x="0" y="0" width="10" height="10" rx="1.5" fill="url(#pGrad)"/>
      <rect x="12" y="0" width="10" height="10" rx="1.5" fill="url(#pGrad)"/>
      <rect x="24" y="0" width="10" height="10" rx="1.5" fill="url(#pGrad)"/>
      <rect x="36" y="0" width="10" height="10" rx="1.5" fill="url(#pGrad)"/>
      <rect x="0" y="12" width="10" height="10" rx="1.5" fill="url(#pGrad)"/>
      <rect x="48" y="12" width="10" height="10" rx="1.5" fill="url(#pGrad)"/>
      <rect x="0" y="24" width="10" height="10" rx="1.5" fill="url(#pGrad)"/>
      <rect x="48" y="24" width="10" height="10" rx="1.5" fill="url(#pGrad)"/>
      <rect x="0" y="36" width="10" height="10" rx="1.5" fill="url(#pGrad)"/>
      <rect x="12" y="36" width="10" height="10" rx="1.5" fill="url(#pGrad)"/>
      <rect x="24" y="36" width="10" height="10" rx="1.5" fill="url(#pGrad)"/>
      <rect x="36" y="36" width="10" height="10" rx="1.5" fill="url(#pGrad)"/>
      <rect x="0" y="48" width="10" height="10" rx="1.5" fill="url(#pGrad)"/>
      <rect x="0" y="60" width="10" height="10" rx="1.5" fill="url(#pGrad)"/>
      <rect x="0" y="72" width="10" height="10" rx="1.5" fill="url(#pGrad)"/>

      <!-- S (Indigo Violet) -->
      <rect x="96" y="0" width="10" height="10" rx="1.5" fill="url(#sGrad)"/>
      <rect x="108" y="0" width="10" height="10" rx="1.5" fill="url(#sGrad)"/>
      <rect x="120" y="0" width="10" height="10" rx="1.5" fill="url(#sGrad)"/>
      <rect x="132" y="0" width="10" height="10" rx="1.5" fill="url(#sGrad)"/>
      <rect x="84" y="12" width="10" height="10" rx="1.5" fill="url(#sGrad)"/>
      <rect x="84" y="24" width="10" height="10" rx="1.5" fill="url(#sGrad)"/>
      <rect x="96" y="36" width="10" height="10" rx="1.5" fill="url(#sGrad)"/>
      <rect x="108" y="36" width="10" height="10" rx="1.5" fill="url(#sGrad)"/>
      <rect x="120" y="36" width="10" height="10" rx="1.5" fill="url(#sGrad)"/>
      <rect x="132" y="48" width="10" height="10" rx="1.5" fill="url(#sGrad)"/>
      <rect x="132" y="60" width="10" height="10" rx="1.5" fill="url(#sGrad)"/>
      <rect x="84" y="72" width="10" height="10" rx="1.5" fill="url(#sGrad)"/>
      <rect x="96" y="72" width="10" height="10" rx="1.5" fill="url(#sGrad)"/>
      <rect x="108" y="72" width="10" height="10" rx="1.5" fill="url(#sGrad)"/>
      <rect x="120" y="72" width="10" height="10" rx="1.5" fill="url(#sGrad)"/>
    </g>

    <!-- Subtitle / Terminal prompt under logo -->
    <text x="165" y="194" text-anchor="middle" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="12" fill="#94a3b8" font-weight="500">MLOps &amp; AI Systems</text>

    <!-- Neofetch Color Blocks Palette -->
    <g transform="translate(84, 218)">
      <rect x="0" y="0" width="18" height="10" rx="2" fill="#f43f5e"/>
      <rect x="24" y="0" width="18" height="10" rx="2" fill="#fb923c"/>
      <rect x="48" y="0" width="18" height="10" rx="2" fill="#34d399"/>
      <rect x="72" y="0" width="18" height="10" rx="2" fill="#38bdf8"/>
      <rect x="96" y="0" width="18" height="10" rx="2" fill="#818cf8"/>
      <rect x="120" y="0" width="18" height="10" rx="2" fill="#c084fc"/>
      <rect x="144" y="0" width="18" height="10" rx="2" fill="#38bdf8"/>
    </g>

    <!-- Vertical Divider -->
    <rect x="330" y="50" width="1" height="216" fill="#1e293b"/>

    <!-- Neofetch Specs List -->
    <g font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="13">
      <text x="356" y="76" fill="#38bdf8" font-weight="bold">pushkar@github</text>
      <rect x="356" y="86" width="220" height="1" fill="#1e293b"/>
      <text x="356" y="108" fill="#f8fafc" font-weight="600">Pushkar Shahi</text>
      <text x="356" y="130" fill="#94a3b8">MLOps &amp; AI Systems Engineer, B.Tech @ Mirai</text>

      <text x="356" y="166" fill="#38bdf8" font-weight="600">skills</text>
      <text x="465" y="166" fill="#e2e8f0">Python, MLOps, Docker, FastAPI, Ollama, LLaMA, n8n</text>

      <text x="356" y="190" fill="#818cf8" font-weight="600">building</text>
      <text x="465" y="190" fill="#e2e8f0">OpenClaw, Industrial Vision, Mirai Project, Agents</text>

      <text x="356" y="214" fill="#38bdf8" font-weight="600">interests</text>
      <text x="465" y="214" fill="#e2e8f0">Self-hosting, Local LLMs, Agent Workflows, Linux</text>

      <text x="356" y="238" fill="#818cf8" font-weight="600">also into</text>
      <text x="465" y="238" fill="#e2e8f0">Hackathons, Systems Design, Terminal Rice, Learning</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="899" height="299" rx="12" fill="none" stroke="#1e293b"/>
</svg>
