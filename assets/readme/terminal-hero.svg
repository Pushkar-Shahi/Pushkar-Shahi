      <rect x="24" y="0" width="18" height="10" rx="2" fill="#f59e0b"/>
      <rect x="48" y="0" width="18" height="10" rx="2" fill="#10b981"/>
      <rect x="72" y="0" width="18" height="10" rx="2" fill="#06b6d4"/>
      <rect x="96" y="0" width="18" height="10" rx="2" fill="#3b82f6"/>
