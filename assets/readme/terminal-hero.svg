      <text x="465" y="190" fill="#e4e4e7">OpenClaw, Industrial Vision, Mirai Project, Agents</text>

      <text x="356" y="214" fill="#22c55e">interests</text>
      <text x="465" y="214" fill="#e4e4e7">Self-hosting, Local LLMs, Agent Workflows, Linux</text>

      <text x="356" y="238" fill="#22c55e">also into</text>
      <text x="465" y="238" fill="#e4e4e7">Hackathons, Systems Design, Terminal Rice, Learning</text>
