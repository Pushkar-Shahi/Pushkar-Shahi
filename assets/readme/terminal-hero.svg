      <rect x="0" y="0" width="10" height="10" rx="1.5" fill="#22c55e"/>
      <rect x="12" y="0" width="10" height="10" rx="1.5" fill="#22c55e"/>
      <rect x="24" y="0" width="10" height="10" rx="1.5" fill="#22c55e"/>
      <rect x="36" y="0" width="10" height="10" rx="1.5" fill="#22c55e"/>
      <rect x="0" y="12" width="10" height="10" rx="1.5" fill="#22c55e"/>
      <rect x="48" y="12" width="10" height="10" rx="1.5" fill="#22c55e"/>
      <rect x="0" y="24" width="10" height="10" rx="1.5" fill="#22c55e"/>
      <rect x="48" y="24" width="10" height="10" rx="1.5" fill="#22c55e"/>
      <rect x="0" y="36" width="10" height="10" rx="1.5" fill="#22c55e"/>
