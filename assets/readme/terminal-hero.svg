      <rect x="108" y="0" width="10" height="10" rx="1.5" fill="#0891b2"/>
      <rect x="120" y="0" width="10" height="10" rx="1.5" fill="#0891b2"/>
      <rect x="132" y="0" width="10" height="10" rx="1.5" fill="#0891b2"/>
      <rect x="84" y="12" width="10" height="10" rx="1.5" fill="#0891b2"/>
      <rect x="84" y="24" width="10" height="10" rx="1.5" fill="#0891b2"/>
      <rect x="96" y="36" width="10" height="10" rx="1.5" fill="#0891b2"/>
      <rect x="108" y="36" width="10" height="10" rx="1.5" fill="#0891b2"/>
      <rect x="120" y="36" width="10" height="10" rx="1.5" fill="#0891b2"/>
      <rect x="132" y="48" width="10" height="10" rx="1.5" fill="#0891b2"/>
