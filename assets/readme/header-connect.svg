<svg width="850" height="42" viewBox="0 0 850 42" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="COMMUNICATION &amp; CHANNELS">
  <defs>
    <linearGradient id="grad_header_connect_svg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="lineGrad_header_connect_svg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Container Pill -->
  <rect x="1" y="4" width="310" height="34" rx="8" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
  <rect x="1" y="4" width="310" height="34" rx="8" fill="none" stroke="url(#grad_header_connect_svg)" stroke-width="1" stroke-dasharray="14 160"/>

  <!-- Icon Circle -->
  <circle cx="21" cy="21" r="10" fill="#131c31"/>
  <circle cx="21" cy="21" r="3.5" fill="#f43f5e"/>

  <!-- Title Text -->
  <text x="42" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11.5" font-weight="800" fill="url(#grad_header_connect_svg)" letter-spacing="1">
    COMMUNICATION &amp; CHANNELS
  </text>

  <!-- Tag Chip -->
  <rect x="320" y="11" width="135" height="20" rx="4" fill="#0b1120" stroke="#334155" stroke-width="0.8"/>
  <text x="387.5" y="24.5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#94a3b8" letter-spacing="0.5">
    05 // CONNECT
  </text>

  <!-- Trailing Circuit Line -->
  <line x1="465" y1="21" x2="830" y2="21" stroke="url(#lineGrad_header_connect_svg)" stroke-width="1.5"/>
  <circle cx="835" cy="21" r="2.5" fill="#fb923c" opacity="0.7"/>
</svg>